name: commitlint

on:
  pull_request:

concurrency:
  group: "commitlint-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Lint the commits of the pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cl" --no-audit --no-fund --loglevel=error @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          cp commitlint.config.cjs "$RUNNER_TEMP/cl/"
          "$RUNNER_TEMP/cl/node_modules/.bin/commitlint" --cwd "$GITHUB_WORKSPACE" --config "$RUNNER_TEMP/cl/commitlint.config.cjs" --from "$BASE" --to "$HEAD" --verbose
