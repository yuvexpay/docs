name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: "pr-title-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Lint the squash commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cl" --no-audit --no-fund --loglevel=error @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4
          cp commitlint.config.cjs "$RUNNER_TEMP/cl/"
          printf '%s (#%s)\n' "$TITLE" "$NUMBER" | "$RUNNER_TEMP/cl/node_modules/.bin/commitlint" --config "$RUNNER_TEMP/cl/commitlint.config.cjs" --verbose
